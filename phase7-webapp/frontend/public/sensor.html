<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>LITHOS Phone Sensor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, sans-serif;
    background: #060c18;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 20px 40px;
    -webkit-tap-highlight-color: transparent;
  }
  .logo     { font-size: 12px; font-weight: 900; letter-spacing: 0.3em; color: #00C2FF; text-transform: uppercase; }
  .subtitle { font-size: 10px; color: rgba(255,255,255,0.3); letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 6px; }
  .sid      { font-size: 10px; font-family: monospace; color: rgba(0,194,255,0.6); background: rgba(0,194,255,0.08); border: 1px solid rgba(0,194,255,0.15); border-radius: 8px; padding: 3px 10px; margin-bottom: 24px; }

  .gauge-wrap { position:relative; width:200px; height:200px; margin-bottom:20px; }
  .gauge-svg  { width:200px; height:200px; transform:rotate(-90deg); }
  .gbg  { fill:none; stroke:rgba(255,255,255,0.05); stroke-width:14; }
  .gfil { fill:none; stroke-width:14; stroke-linecap:round; transition:stroke-dashoffset .2s,stroke .2s; }
  .gcen { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .gval { font-size:40px; font-weight:900; font-family:monospace; transition:color .2s; }
  .gunit{ font-size:10px; color:rgba(255,255,255,0.3); letter-spacing:.12em; text-transform:uppercase; }
  .gstat{ font-size:9px; font-weight:900; letter-spacing:.12em; text-transform:uppercase; margin-top:5px; padding:2px 8px; border-radius:20px; transition:all .3s; }

  .grid { display:none; grid-template-columns:1fr 1fr; gap:8px; width:100%; max-width:300px; margin-bottom:16px; }
  .cell { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.07); border-radius:12px; padding:10px; text-align:center; }
  .clbl { font-size:9px; color:rgba(255,255,255,0.3); text-transform:uppercase; letter-spacing:.1em; margin-bottom:3px; }
  .cval { font-size:18px; font-weight:700; font-family:monospace; }

  .bar-wrap { display:none; width:100%; max-width:300px; margin-bottom:20px; }
  .blbl { display:flex; justify-content:space-between; font-size:9px; color:rgba(255,255,255,0.3); margin-bottom:4px; }
  .btrk { height:8px; background:rgba(255,255,255,0.06); border-radius:99px; overflow:visible; position:relative; }
  .bfil { height:100%; border-radius:99px; transition:width .2s,background .2s; }
  .btick{ position:absolute; top:-4px; left:20%; width:2px; height:16px; background:#FF9500; border-radius:1px; transform:translateX(-50%); }

  .btn { width:100%; max-width:300px; padding:17px; border-radius:14px; border:none; font-size:13px; font-weight:900; letter-spacing:.12em; text-transform:uppercase; cursor:pointer; transition:all .2s; margin-bottom:14px; }
  .go  { background:#00C2FF; color:#000; box-shadow:0 0 28px rgba(0,194,255,.4); }
  .stp { background:rgba(255,59,48,.15); color:#FF3B30; border:1px solid rgba(255,59,48,.3); }

  .status-row { display:none; width:100%; max-width:300px; background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,0.07); border-radius:10px; padding:8px 12px; font-family:monospace; font-size:11px; color:rgba(255,255,255,0.5); margin-bottom:12px; }

  .warn-box { display:none; background:rgba(255,149,0,.1); border:1px solid rgba(255,149,0,.3); border-radius:12px; padding:12px 14px; font-size:11px; color:rgba(255,149,0,.9); width:100%; max-width:300px; margin-bottom:12px; line-height:1.7; }

  .log-h { display:none; justify-content:space-between; align-items:center; width:100%; max-width:300px; margin-bottom:6px; }
  .log-t { font-size:9px; font-weight:900; text-transform:uppercase; letter-spacing:.18em; color:rgba(255,255,255,0.3); }
  .log-b { font-size:9px; font-weight:900; padding:2px 8px; border-radius:99px; background:rgba(255,59,48,.15); color:#FF3B30; }
  .log-l { width:100%; max-width:300px; }
  .log-i { display:flex; justify-content:space-between; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.06); border-radius:10px; padding:8px 12px; margin-bottom:6px; font-size:11px; }
  .lt { color:#FF3B30; font-weight:700; }
  .ltime { color:rgba(255,255,255,0.3); }

  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.4} }
  .pulse { animation:pulse 1s infinite; }
</style>
</head>
<body>

<div class="logo">📡 LITHOS</div>
<div class="subtitle">Slope Sensor</div>
<div class="sid" id="sid">ID: ...</div>

<div class="gauge-wrap">
  <svg class="gauge-svg" viewBox="0 0 200 200">
    <circle class="gbg" cx="100" cy="100" r="85"/>
    <circle id="gf" class="gfil" cx="100" cy="100" r="85" stroke="#00C2FF" stroke-dasharray="534" stroke-dashoffset="534"/>
  </svg>
  <div class="gcen">
    <div id="gv" class="gval" style="color:#00C2FF">--</div>
    <div class="gunit">degrees</div>
    <div id="gs" class="gstat" style="background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.3)">● STANDBY</div>
  </div>
</div>

<div class="grid" id="xy">
  <div class="cell"><div class="clbl">Beta / Pitch</div><div class="cval" id="vb">0°</div></div>
  <div class="cell"><div class="clbl">Gamma / Roll</div><div class="cval" id="vg">0°</div></div>
</div>

<div class="bar-wrap" id="bw">
  <div class="blbl"><span>0°</span><span style="color:#FF9500;font-weight:700">⚠ 3° alert</span><span>15°</span></div>
  <div class="btrk">
    <div id="bf" class="bfil" style="width:0%;background:#00C2FF"></div>
    <div class="btick"></div>
  </div>
</div>

<div class="status-row" id="sr">● Waiting for data...</div>

<div class="warn-box" id="wb"></div>

<button id="btn" class="btn go" onclick="toggle()">▶  Start Monitoring</button>

<div class="log-h" id="lh"><span class="log-t">Alerts Sent to LITHOS</span><span class="log-b" id="lc">0</span></div>
<div class="log-l" id="ll"></div>

<script>
const THRESH = 3, MAXDEG = 15;
const CIRC   = 2 * Math.PI * 85;
const API    = window.location.protocol + '//' + window.location.hostname + ':8000';
const DLAT   = 25.2689, DLON = 91.7327; // Cherrapunji demo

const sid = (()=>{
  let s = localStorage.getItem('lithos_sid');
  if(!s){ s='PH-'+Math.random().toString(36).substr(2,5).toUpperCase(); localStorage.setItem('lithos_sid',s); }
  return s;
})();
document.getElementById('sid').textContent = 'ID: ' + sid;

let active=false, alerts=0, lastAlertTs=0;
let ohnd=null, mhnd=null;

function update(beta, gamma) {
  const tilt = Math.sqrt(beta*beta + gamma*gamma);
  const pct  = Math.min(1, tilt/MAXDEG);

  // gauge fill
  document.getElementById('gf').style.strokeDashoffset = CIRC*(1-pct);
  document.getElementById('gf').style.stroke = tilt>THRESH ? '#FF3B30' : '#00C2FF';
  tilt>THRESH ? document.getElementById('gf').classList.add('pulse')
              : document.getElementById('gf').classList.remove('pulse');

  // gauge center
  document.getElementById('gv').textContent    = tilt.toFixed(1)+'°';
  document.getElementById('gv').style.color    = tilt>THRESH ? '#FF3B30' : '#00C2FF';
  document.getElementById('gs').textContent    = tilt>THRESH ? '🔴 TILT DETECTED' : '● MONITORING';
  document.getElementById('gs').style.background = tilt>THRESH ? 'rgba(255,59,48,.2)' : 'rgba(0,194,255,.1)';
  document.getElementById('gs').style.color    = tilt>THRESH ? '#FF3B30' : '#00C2FF';

  // grid + bar
  document.getElementById('vb').textContent = beta.toFixed(1)+'°';
  document.getElementById('vg').textContent = gamma.toFixed(1)+'°';
  document.getElementById('bf').style.width      = (pct*100)+'%';
  document.getElementById('bf').style.background = tilt>THRESH ? '#FF3B30' : '#00C2FF';
  document.getElementById('sr').textContent = '✅ β='+beta.toFixed(1)+'° γ='+gamma.toFixed(1)+'° tilt='+tilt.toFixed(1)+'°';

  if(tilt>THRESH) doAlert(tilt);
}

async function doAlert(tilt) {
  const now = Date.now();
  if(now-lastAlertTs < 15000) return;
  lastAlertTs = now;
  try {
    await fetch(API+'/api/sensor/report',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({sensor_id:sid,lat:DLAT,lon:DLON,type:'tilt',value:parseFloat(tilt.toFixed(2)),battery:95})
    });
    alerts++;
    document.getElementById('lc').textContent = alerts;
    document.getElementById('lh').style.display='flex';
    const el=document.createElement('div');
    el.className='log-i';
    el.innerHTML='<span class="lt">🔴 '+tilt.toFixed(1)+'°</span><span class="ltime">'+new Date().toLocaleTimeString()+'</span>';
    const L=document.getElementById('ll');
    L.insertBefore(el,L.firstChild);
    if(L.children.length>5) L.removeChild(L.lastChild);
  } catch(e){}
}

async function start() {
  document.getElementById('btn').disabled=true;
  document.getElementById('btn').textContent='⏳ Starting...';
  document.getElementById('wb').style.display='none';

  // iOS permission
  if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
    try{
      const p=await DeviceOrientationEvent.requestPermission();
      if(p!=='granted'){
        document.getElementById('wb').innerHTML='<b>Motion permission denied.</b> Allow in Safari Settings → Motion & Orientation.';
        document.getElementById('wb').style.display='block';
        document.getElementById('btn').disabled=false;
        document.getElementById('btn').textContent='▶  Start Monitoring';
        return;
      }
    }catch(e){}
  }

  // deviceorientation handler
  ohnd = e => {
    if(e.beta===null || e.gamma===null) return;
    update(e.beta, e.gamma);
  };
  window.addEventListener('deviceorientation', ohnd, true);

  // 3s watchdog
  setTimeout(()=>{
    if(active && document.getElementById('gv').textContent==='--'){
      document.getElementById('wb').innerHTML=
        '<b>⚠ Sensor blocked by Chrome.</b><br>'+
        'The flag was set correctly but may need a full Chrome restart.<br>'+
        'Try: close ALL Chrome tabs → reopen → go to sensor.html<br><br>'+
        'Or try on Firefox for Android (no restrictions).';
      document.getElementById('wb').style.display='block';
    }
  },3000);

  active=true;
  document.getElementById('btn').disabled=false;
  document.getElementById('btn').textContent='⏹  Stop';
  document.getElementById('btn').className='btn stp';
  document.getElementById('xy').style.display='grid';
  document.getElementById('bw').style.display='block';
  document.getElementById('sr').style.display='block';
}

function stop() {
  if(ohnd){ window.removeEventListener('deviceorientation',ohnd,true); ohnd=null; }
  active=false;
  document.getElementById('btn').textContent='▶  Start Monitoring';
  document.getElementById('btn').className='btn go';
  document.getElementById('xy').style.display='none';
  document.getElementById('bw').style.display='none';
  document.getElementById('sr').style.display='none';
  document.getElementById('gf').style.strokeDashoffset=CIRC;
  document.getElementById('gf').style.stroke='#00C2FF';
  document.getElementById('gf').classList.remove('pulse');
  document.getElementById('gv').textContent='--';
  document.getElementById('gv').style.color='#00C2FF';
  document.getElementById('gs').textContent='● STANDBY';
  document.getElementById('gs').style.background='rgba(255,255,255,0.05)';
  document.getElementById('gs').style.color='rgba(255,255,255,0.3)';
}

function toggle(){ if(active) stop(); else start(); }
</script>
</body>
</html>
